site_name: Smart Tour — Engineering Training
docs_dir: docs/engineering-training
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.instant
    - search.highlight
    - content.code.copy

nav:
  - Progress: MASTER_PROGRESS.md
  - Tickets:
      - ST-001: tickets/ST-001.md
  - Incident log: incident-log.md
  - Concept tracker: concept-tracker.md
  - Mentor rules: MENTOR_PROMPT.md
  - Platform brief: platform-brief.md

markdown_extensions:
  - tables
  - admonition
  - toc: { permalink: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
